<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeamEntry</title>
  <meta name="description" content="TeamEntry가 만드는 iPhone, iPad, Mac 앱입니다.">
  <link rel="alternate" hreflang="en" href="/en/">
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles/tokens.css">
  <link rel="stylesheet" href="/assets/styles/base.css">
  <link rel="stylesheet" href="/assets/styles/layout.css">
  <link rel="stylesheet" href="/assets/styles/components.css">
  <script type="module" src="/assets/scripts/main.js"></script>
</head>
<body>
  <site-header></site-header>

  <main>
    <section class="hero container">
      <p class="hero__eyebrow">TeamEntry</p>
      <h1 class="hero__title">
        매일 손이 가는<br>
        <span class="text-gradient">작고 단단한 앱.</span>
      </h1>
      <p class="hero__lead">계정 없이 바로 쓰고, 광고 없이 한 가지 일에 집중하는 앱을 만듭니다.</p>
    </section>

    <section id="apps" class="section">
      <div class="container">
        <div class="app-grid">
          <a class="app-card" href="/screen-anywhere/">
            <img class="app-card__icon" src="/screen-anywhere/images/icon.png" alt="" width="72" height="72">
            <h2 class="app-card__name">RemoteScreen</h2>
            <p class="app-card__summary">iPhone과 iPad로 내 Mac을 보고 조작합니다.</p>
            <p class="app-card__platforms">iPhone, iPad, Mac</p>
          </a>
          <a class="app-card" href="/kiku/">
            <img class="app-card__icon" src="/kiku/images/icon.png" alt="" width="72" height="72">
            <h2 class="app-card__name">키꾸</h2>
            <p class="app-card__summary">iPhone 키보드를 키캡처럼 꾸밉니다.</p>
            <p class="app-card__platforms">iPhone</p>
          </a>
        </div>
      </div>
    </section>
  </main>

  <site-footer></site-footer>
</body>
</html>
