<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeamEntry</title>
  <meta name="description" content="Apps for iPhone, iPad and Mac by TeamEntry.">
  <link rel="alternate" hreflang="ko" href="/">
  <link rel="icon" href="/screen-sharing/images/icon.png">
  <link rel="stylesheet" href="/assets/styles/tokens.css">
  <link rel="stylesheet" href="/assets/styles/base.css">
  <link rel="stylesheet" href="/assets/styles/layout.css">
  <link rel="stylesheet" href="/assets/styles/components.css">
  <script type="module" src="/assets/scripts/main.js"></script>
</head>
<body>
  <site-header></site-header>

  <main>
    <section class="hero container">
      <p class="hero__eyebrow">TeamEntry</p>
      <h1 class="hero__title">
        Small, solid apps<br>
        <span class="text-gradient">you reach for every day.</span>
      </h1>
      <p class="hero__lead">No account to create, no ads to scroll past. Each app focuses on one job.</p>
    </section>

    <section id="apps" class="section">
      <div class="container">
        <div class="app-grid">
          <a class="app-card" href="/en/screen-sharing/">
            <img class="app-card__icon" src="/screen-sharing/images/icon.png" alt="" width="72" height="72">
            <h2 class="app-card__name">Screen Sharing</h2>
            <p class="app-card__summary">See and control your Mac from iPhone and iPad.</p>
            <p class="app-card__platforms">iPhone, iPad, Mac</p>
          </a>
        </div>
      </div>
    </section>
  </main>

  <site-footer></site-footer>
</body>
</html>
